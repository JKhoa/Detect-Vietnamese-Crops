# ────────────────────────────────────────────────────────────────────────────
# hyp_crowded.yaml — Hyperparameters cho YOLO11 khi dataset có nhiều object/ảnh
#
# MỤC TIÊU:
#   1. Ép model học predict NHIỀU bbox đồng thời (không ngủ quên ở object 1)
#   2. Giữ được các bbox chồng chéo (overlap) giữa các loại nông sản khác nhau
#   3. Chống false-negative khi inference ảnh đa object
#
# DÙNG VỚI LỆNH:
#   yolo detect train \
#     model=yolo11n.pt \
#     data=data.yaml \
#     cfg=backend/training/hyp_crowded.yaml \
#     epochs=150 imgsz=640 batch=16 device=0
# ────────────────────────────────────────────────────────────────────────────

# ══════ TRAINING STRATEGY ═══════════════════════════════════════════════════
lr0:            0.01        # learning rate khởi tạo (SGD)
lrf:            0.01        # cosine final lr = lr0 * lrf
momentum:       0.937
weight_decay:   0.0005
warmup_epochs:  3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# ══════ LOSS WEIGHTS (QUAN TRỌNG — chống bỏ sót) ════════════════════════════
# Khi 1 ảnh có nhiều object, loss cls + loss dfl cần lớn để model không "lười"
box:  7.5       # bbox regression loss (mặc định 7.5)
cls:  1.0       # classification loss — TĂNG từ 0.5 lên 1.0 (74 class nhiều)
dfl:  1.5       # distribution focal loss — giữ 1.5 (giúp predict bbox chính xác)

# ══════ NMS / ASSIGNMENT (điểm mấu chốt chống chồng chéo) ═══════════════════
# Ultralytics dùng TaskAligned Assigner, không có iou threshold ở train như cũ.
# Nhưng iou ở inference thì CỰC KỲ quan trọng — xem phần dưới.
iou:  0.20      # IoU threshold cho label assignment (thấp → nhiều anchor được gán positive)

# ══════ AUGMENTATION — ONLINE (mỗi batch) ═══════════════════════════════════
# Đây là augmentation Ultralytics làm sẵn. KẾT HỢP với build_mosaic_dataset.py
# để dataset ban đầu đã đa object sẵn → online aug nhân thêm biến thể.
hsv_h:      0.015    # hue jitter
hsv_s:      0.7      # saturation jitter
hsv_v:      0.4      # value jitter
degrees:    10.0     # rotation ±10°
translate:  0.2      # shift ±20%
scale:      0.7      # scale jitter (0.3-1.7x)
shear:      2.0      # shear ±2°
perspective: 0.0002
flipud:     0.3      # vertical flip 30% (nông sản đối xứng được)
fliplr:     0.5      # horizontal flip 50%

# MOSAIC + MIXUP + COPY-PASTE — TĂNG MẠNH
mosaic:      1.0     # LUÔN dùng mosaic (4 ảnh ghép) — TRIỆT ĐỂ chống single-object bias
mixup:       0.15    # 15% batches dùng mixup
copy_paste:  0.30    # 30% ảnh dùng copy-paste — QUAN TRỌNG NHẤT
close_mosaic: 15     # TẮT mosaic ở 15 epoch cuối → model fine-tune trên distribution tự nhiên
erasing:     0.4     # random erasing 40%

# ══════ MULTI-SCALE TRAINING ═══════════════════════════════════════════════
multi_scale: true    # size jitter ±50% mỗi batch — giúp detect object nhỏ/lớn
rect: false          # KHÔNG dùng rectangular training (conflict với mosaic)

# ══════ OPTIMIZER ══════════════════════════════════════════════════════════
optimizer: SGD       # SGD ổn định hơn Adam cho detection
cos_lr:    true      # cosine learning rate
amp:       true      # mixed precision
patience:  50        # early stopping nếu 50 epoch không cải thiện

# ══════ DATASET ══════════════════════════════════════════════════════════
cache:      false    # để false nếu RAM hạn chế
workers:    8
overlap_mask: true
mask_ratio: 4
