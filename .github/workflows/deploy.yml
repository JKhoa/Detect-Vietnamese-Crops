name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: "Web app for agricultural detection/package-lock.json"

      - name: Install dependencies
        working-directory: "Web app for agricultural detection"
        run: npm ci

      - name: Build (inject GCV API key từ GitHub Secret)
        working-directory: "Web app for agricultural detection"
        env:
          VITE_GCV_API_KEY: ${{ secrets.VITE_GCV_API_KEY }}
          VITE_MOCK_MODE: "false"
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "Web app for agricultural detection/dist"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
