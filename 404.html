<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      // GitHub Pages SPA fallback: redirect deep links to index with encoded route.
      (function () {
        var loc = window.location;
        var path = loc.pathname + loc.search + loc.hash;
        var encodedPath = encodeURIComponent(path).replace(/&/g, '~and~');
        var basePath = '/Detect-Vietnamese-Crops/';

        loc.replace(basePath + '?p=' + encodedPath);
      })();
    </script>
  </head>
  <body></body>
</html>
